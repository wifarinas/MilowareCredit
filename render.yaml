# Use this Blueprint to deploy n8n on Render as a web
# service that uses a Postgres database to store
# workflow data.
#
# This Blueprint uses free instance types (specified by
# `plan`) for both the web service and the database. You
# can upgrade to paid instance types at any time to
# increase resources.

services:
  - type: web
    plan: free
    # This is the runtime for services that pull a prebuilt Docker image
    runtime: image
    # You can give the service any name
    name: n8n-service
    image:
      # Pin to the minimum secure n8n 1.x release supported by this deployment
      url: docker.io/n8nio/n8n:1.121.0
    envVars:
      # Generates a base64-encoded key for encrypting credentials in n8n
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      # n8n's HTTP port
      - key: PORT
        value: "5678"
      # Public root URL used by webhook nodes, including WhatsApp
      - key: WEBHOOK_URL
        value: https://n8n-service-wy7r.onrender.com/
      # Connect n8n to the Render Postgres database defined below
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user

databases:
  - name: n8n-db
    plan: free
